<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PIXEL TEKKEN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    background-color: #000; color: #fff; margin: 0;
    font-family: 'Press Start 2P', cursive;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; overflow: hidden;
  }
  
  #game-wrapper {
    position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9;
    margin-top: 2vh; border: 4px solid #fff; box-shadow: 0 0 20px #f00;
    background-color: #111;
  }

  /* 픽셀 감성을 위한 마법의 CSS */
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  /* UI 레이어 */
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; padding: 20px 40px; box-sizing: border-box; display: none;
  }

  /* 완벽한 빨간색 체력바 (노란색 지연 효과 포함) */
  .health-container {
    position: absolute; top: 25px; width: 38%; height: 25px;
    background-color: #222; border: 3px solid #fff; box-shadow: 4px 4px 0 #000;
  }
  #p1-health-container { left: 40px; }
  #p2-health-container { right: 40px; }

  .health-bar-current {
    position: absolute; top: 0; height: 100%;
    background-color: #e50000; /* 진한 아케이드 레드 */
    z-index: 2; transition: width 0.1s;
  }
  .health-bar-delay {
    position: absolute; top: 0; height: 100%;
    background-color: #ffcc00; /* 깎인 체력 딜레이 옐로우 */
    z-index: 1; transition: width 0.5s ease-out;
  }
  #p1-health, #p1-health-delay { left: 0; }
  #p2-health, #p2-health-delay { right: 0; }

  #timer {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    font-size: 32px; color: #ffeb3b; text-shadow: 4px 4px 0 #000;
  }

  .name-tag { position: absolute; top: 60px; font-size: 16px; text-shadow: 2px 2px 0 #000; }
  #p1-name { left: 40px; color: #0ff; }
  #p2-name { right: 40px; color: #f0f; text-align: right; }

  .combo-text { position: absolute; top: 110px; font-size: 20px; color: #f30; text-shadow: 2px 2px 0 #fff; opacity: 0; }
  #p1-combo-txt { left: 40px; }
  #p2-combo-txt { right: 40px; }

  /* 메뉴 및 캐릭터 선택 */
  #menu-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: flex; flex-direction: column; 
    align-items: center; justify-content: center; z-index: 10;
  }
  h1 { font-size: 3vw; color: #ff0055; text-shadow: 4px 4px 0 #fff; margin-bottom: 20px; text-align: center; line-height: 1.5; }
  
  #char-select {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px;
    width: 90%; max-height: 50%; overflow-y: auto; padding: 10px;
  }
  .char-btn {
    background: #000; color: #fff; border: 2px solid #fff; padding: 10px 5px;
    font-family: 'Press Start 2P', cursive; font-size: 10px; cursor: pointer; transition: 0.1s;
  }
  .char-btn:hover { background: #fff; color: #000; transform: scale(1.1); }
  #status-msg { font-size: 16px; color: #0fd; margin-bottom: 20px; }

  /* 조작법 */
  .controls-info { margin-top: 15px; color: #aaa; font-size: 12px; text-align: center; line-height: 1.8; font-family: monospace; }
  .controls-info b { color: #fff; }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- 핵심: 가상 해상도를 320x180으로 낮춰 완벽한 픽셀 도트 생성 -->
  <canvas id="gameCanvas" width="320" height="180"></canvas>
  
  <div id="ui-layer">
    <div id="p1-health-container" class="health-container">
      <div id="p1-health-delay" class="health-bar-delay" style="width:100%;"></div>
      <div id="p1-health" class="health-bar-current" style="width:100%;"></div>
    </div>
    <div id="p2-health-container" class="health-container">
      <div id="p2-health-delay" class="health-bar-delay" style="width:100%;"></div>
      <div id="p2-health" class="health-bar-current" style="width:100%;"></div>
    </div>
    <div id="timer">99</div>
    <div id="p1-name" class="name-tag">P1</div>
    <div id="p2-name" class="name-tag">P2</div>
    <div id="p1-combo-txt" class="combo-text"></div>
    <div id="p2-combo-txt" class="combo-text"></div>
  </div>

  <div id="menu-layer">
    <h1>PIXEL TEKKEN<br>TAG TOURNAMENT</h1>
    <div id="status-msg">P1: SELECT POINT CHAR</div>
    <div id="char-select"></div>
  </div>
</div>

<div class="controls-info">
  <b>[P1]</b> 이동: WASD | <b>연계기:</b> Z ➔ Z ➔ X | <b>띄우기:</b> S+Z | <b>태그:</b> T <br>
  <b>[P2]</b> 이동: 방향키 | <b>연계기:</b> I ➔ I ➔ O | <b>띄우기:</b> ↓+I | <b>태그:</b> L
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // 가상 해상도 설정
  const VW = 320; 
  const VH = 180;
  const GROUND_Y = 150; // 바닥 Y좌표

  let reqId, timeLeft = 99, gameActive = false, hitStop = 0, cameraShake = 0;
  let keys = {}, particles = [];
  
  // 20인 로스터 (색상으로 픽셀 캐릭터 개성 부여)
  const roster = [
    { name: "JIN", col: "#f00" }, { name: "KAZUYA", col: "#808" }, { name: "HEIHACHI", col: "#888" }, { name: "PAUL", col: "#f80" },
    { name: "LAW", col: "#ff0" }, { name: "KING", col: "#d70" }, { name: "YOSHI", col: "#0f0" }, { name: "NINA", col: "#f0f" },
    { name: "HWOARANG", col: "#f50" }, { name: "XIAOYU", col: "#f8b" }, { name: "BRYAN", col: "#555" }, { name: "STEVE", col: "#00f" },
    { name: "ASUKA", col: "#0df" }, { name: "LILI", col: "#fff" }, { name: "DRAGUNOV", col: "#444" }, { name: "ALISA", col: "#f7a" },
    { name: "FENG", col: "#c00" }, { name: "JACK-8", col: "#0f8" }, { name: "D.JIN", col: "#222" }, { name: "AKUMA", col: "#005" }
  ];

  let p1Team = [], p2Team = [], selectStep = 0;

  function initSelect() {
    const grid = document.getElementById('char-select');
    grid.innerHTML = '';
    roster.forEach(c => {
      let btn = document.createElement('button');
      btn.className = 'char-btn';
      btn.style.borderColor = c.col;
      btn.innerText = c.name;
      btn.onclick = () => selectChar(c);
      grid.appendChild(btn);
    });
  }

  function selectChar(char) {
    if(selectStep === 0) p1Team.push(char); else if(selectStep === 1) p1Team.push(char);
    else if(selectStep === 2) p2Team.push(char); else if(selectStep === 3) p2Team.push(char);
    
    selectStep++;
    const msgs = ["P1: SELECT TAG", "P2: SELECT POINT", "P2: SELECT TAG", "GET READY!"];
    document.getElementById('status-msg').innerText = msgs[selectStep] || "GET READY!";
    
    if(selectStep > 3) setTimeout(startGame, 500);
  }

  function updateHealthUI() {
    document.getElementById('p1-health').style.width = p1.hp + '%';
    setTimeout(() => { if(document.getElementById('p1-health-delay')) document.getElementById('p1-health-delay').style.width = p1.hp + '%'; }, 400);
    document.getElementById('p2-health').style.width = p2.hp + '%';
    setTimeout(() => { if(document.getElementById('p2-health-delay')) document.getElementById('p2-health-delay').style.width = p2.hp + '%'; }, 400);
  }

  // --- 픽셀 캐릭터 클래스 ---
  class PixelFighter {
    constructor(x, side, team) {
      this.x = x; this.y = GROUND_Y;
      this.side = side; this.team = team; this.activeIdx = 0;
      this.hp = [100, 100];
      this.velX = 0; this.velY = 0; this.dir = side === 1 ? 1 : -1;
      
      this.state = 'idle'; this.frame = 0; this.hitbox = null;
      this.comboCount = 0; this.comboTimer = 0; this.tagCooldown = 0;
    }
    
    get char() { return this.team[this.activeIdx]; }
    get hp() { return this.hpArr[this.activeIdx]; }
    set hp(val) { this.hpArr[this.activeIdx] = val; }
    get hpArr() { return this.hp_array || (this.hp_array = [100, 100]); }

    update(enemy) {
      if(this.state === 'idle' || this.state === 'walk') this.dir = enemy.x > this.x ? 1 : -1;

      // 물리
      if(this.y < GROUND_Y) {
        this.velY += 0.8; this.y += this.velY;
        if(this.state !== 'hit' && this.state !== 'airHit' && this.state !== 'launcher') {
          if(this.velY < 0) this.state = 'jump';
        }
      } else {
        this.y = GROUND_Y; this.velY = 0;
        if(this.state === 'jump' || this.state === 'airHit') this.state = 'idle';
      }
      
      this.x += this.velX; 
      this.x = Math.max(10, Math.min(VW - 10, this.x)); // 화면 제한 (작은 해상도 기준)
      
      // 마찰력
      if(this.y === GROUND_Y && (this.state === 'idle' || this.state === 'guard')) this.velX *= 0.6;
      if(this.tagCooldown > 0) this.tagCooldown--;

      // 프레임 진행
      if(this.state !== 'idle' && this.state !== 'walk' && this.state !== 'jump' && this.state !== 'guard') {
        this.frame++;
        
        let endFrame = 20; 
        if(this.state === 'punch1') endFrame = 12;
        if(this.state === 'punch2') endFrame = 15;
        if(this.state === 'stringFinish') endFrame = 35;
        if(this.state === 'launcher') endFrame = 25;
        if(this.state === 'hit' || this.state === 'airHit') endFrame = 15;

        if(this.frame >= endFrame) {
          if(this.y === GROUND_Y) this.state = 'idle';
          this.hitbox = null;
        } else {
          // 공격 판정 생성
          if(this.frame > 4 && this.frame < 10 && !['hit','airHit'].includes(this.state)) this.generateHitbox();
          else this.hitbox = null;
        }
      } else { this.frame = 0; this.hitbox = null; }

      // 콤보 UI
      if(this.comboTimer > 0) {
        this.comboTimer--;
        if(this.comboTimer === 0) this.comboCount = 0;
      }
      let comboUI = document.getElementById(`p${this.side === 1 ? 2 : 1}-combo-txt`);
      if(this.comboCount > 1) { comboUI.innerText = `${this.comboCount} HITS!`; comboUI.style.opacity = 1; } 
      else { comboUI.style.opacity = 0; }
    }

    generateHitbox() {
      // 320x180 해상도에 맞춘 힛박스 수치
      switch(this.state) {
        case 'punch1': this.hitbox = { x: this.x + (this.dir===1?6:-16), y: this.y - 25, w: 10, h: 6, dmg: 4, hitStop: 3, launch: false }; break;
        case 'punch2': this.hitbox = { x: this.x + (this.dir===1?8:-18), y: this.y - 25, w: 10, h: 6, dmg: 6, hitStop: 4, launch: false }; break;
        case 'stringFinish': this.hitbox = { x: this.x + (this.dir===1?0:-20), y: this.y - 20, w: 20, h: 15, dmg: 12, hitStop: 8, launch: true }; break;
        case 'launcher': this.hitbox = { x: this.x + (this.dir===1?4:-14), y: this.y - 35, w: 10, h: 25, dmg: 8, hitStop: 6, launch: true }; break;
      }
    }

    inputCommand(btn, isDown) {
      if(this.state === 'guard' || this.y !== GROUND_Y) return;

      if(isDown && btn === 'Z') {
        if(this.state === 'idle' || this.state === 'walk') { this.state = 'launcher'; this.frame = 0; }
        return;
      }

      // 연계기 (Z -> Z -> X)
      if(btn === 'Z') {
         if(this.state === 'idle' || this.state === 'walk') { this.state = 'punch1'; this.frame = 0; } 
         else if(this.state === 'punch1' && this.frame > 3 && this.frame < 15) { this.state = 'punch2'; this.frame = 0; }
      }
      else if(btn === 'X') {
         if(this.state === 'punch2' && this.frame > 3 && this.frame < 15) { 
             this.state = 'stringFinish'; this.frame = 0; 
             this.velX = this.dir * 4; this.velY = -3; 
         } 
         else if(this.state === 'idle' || this.state === 'walk') { this.state = 'punch1'; this.frame = 0; } // 기본 킥 대용
      }
    }

    takeDamage(dmg, dir, hitStopFrames, launch, attacker) {
      if(this.state === 'guard' && !launch && this.y === GROUND_Y) {
        this.hp = Math.max(0, this.hp - dmg * 0.1); this.velX = dir * 1; hitStop = 2;
      } else {
        this.hp = Math.max(0, this.hp - dmg);
        if(launch || this.y < GROUND_Y) { // 저글링
          this.state = 'airHit'; this.frame = 0; this.velY = -5; this.velX = dir * 1.5;
          createPixelParticles(this.x, this.y - 20, '#ff0', 10);
        } else {
          this.state = 'hit'; this.frame = 0; this.velX = dir * 3; this.velY = -1;
          createPixelParticles(this.x, this.y - 20, '#f00', 10);
        }
        hitStop = hitStopFrames; cameraShake = hitStopFrames;
        attacker.comboCount++; attacker.comboTimer = 90;
      }
      updateHealthUI();
    }

    // ★ 절차적 픽셀 아트 렌더링 ★
    draw() {
      ctx.save(); ctx.translate(this.x, this.y);

      // 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-6, 0, 12, 2);

      let col = this.state === 'hit' || this.state === 'airHit' ? '#fff' : this.char.col;
      ctx.fillStyle = col;

      // 애니메이션 오프셋 설정
      let hX = 0, hY = -28, bX = -4, bY = -22, bW = 8, bH = 12; // Head, Body
      let a1X = -2, a1Y = -20, a2X = 2, a2Y = -20; // Arms
      let l1X = -3, l1Y = -10, l2X = 1, l2Y = -10; // Legs

      if(this.state === 'walk') {
         let step = Math.sin(Date.now() / 100) * 2;
         hY += Math.abs(step); l1X -= step; l2X += step; a1X += step; a2X -= step;
      }
      else if(this.state === 'guard') { bX -= 2*this.dir; a1X += 4*this.dir; a2X += 4*this.dir; hX -= 2*this.dir; }
      else if(this.state === 'punch1') { a2X += 8*this.dir; bX += 2*this.dir; hX += 2*this.dir; }
      else if(this.state === 'punch2') { a1X += 10*this.dir; bX += 4*this.dir; hX += 3*this.dir; }
      else if(this.state === 'stringFinish') { // 스핀킥 (몸이 눕는 도트 연출)
         ctx.rotate((this.frame * 30 * this.dir) * Math.PI / 180);
         bX = -6; bY = -14; bW = 12; bH = 8; hY = -14; hX = 6*this.dir; l1X = -12*this.dir; l2X = -12*this.dir; a1X=0; a2X=0;
      }
      else if(this.state === 'launcher') { bY = -26; hY = -34; a1Y = -30; a2Y = -30; a2X += 6*this.dir; }
      else if(this.state === 'hit' || this.state === 'airHit') { hX -= 4*this.dir; bX -= 2*this.dir; a1X -= 4*this.dir; a2X -= 4*this.dir; l1X -= 2*this.dir; }
      else if(this.state === 'jump') { l1Y -= 4; l2Y -= 4; a1Y -= 4; a2Y -= 4; }

      // 픽셀 사각형 그리기 (머리, 몸, 팔, 다리)
      ctx.fillRect(hX - 3, hY, 6, 6); // Head
      ctx.fillRect(bX, bY, bW, bH);   // Body
      ctx.fillStyle = '#aaa'; // 팔다리는 약간 어둡게
      ctx.fillRect(a1X - 2, a1Y, 4, 6); // Arm 1
      ctx.fillRect(a2X - 2, a2Y, 4, 6); // Arm 2
      ctx.fillRect(l1X - 2, l1Y, 4, 10); // Leg 1
      ctx.fillRect(l2X - 2, l2Y, 4, 10); // Leg 2
      
      // 눈 포인트 (방향)
      ctx.fillStyle = '#0ff'; ctx.fillRect(hX + (this.dir===1?1:-2), hY + 1, 2, 2);

      ctx.restore();

      // 힛박스 (디버그겸 이펙트)
      if(this.hitbox) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(this.hitbox.x, this.hitbox.y, this.hitbox.w, this.hitbox.h); }
    }
  }

  // 픽셀 파티클 시스템
  function createPixelParticles(x, y, color, count) {
    for(let i=0; i<count; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4-1, life: 1.0, col: color });
  }

  function renderParticles() {
    for(let i=particles.length-1; i>=0; i--) {
      let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
      if(p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 2, 2); // 2x2 픽셀 파티클
    }
    ctx.globalAlpha = 1.0;
  }

  let p1, p2;

  function startGame() {
    document.getElementById('menu-layer').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    
    p1 = new PixelFighter(60, 1, p1Team); 
    p2 = new PixelFighter(260, 2, p2Team); p2.dir = -1;
    
    timeLeft = 99; hitStop = 0; keys = {}; gameActive = true; particles = [];
    
    document.getElementById('p1-name').innerText = p1.char.name;
    document.getElementById('p2-name').innerText = p2.char.name;
    updateHealthUI();
    
    const timerInt = setInterval(() => {
      if(!gameActive) clearInterval(timerInt);
      else if(timeLeft > 0 && p1.hp > 0 && p2.hp > 0) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
    }, 1000);
    
    reqId = requestAnimationFrame(loop);
  }

  function checkCollision(attacker, defender) {
    if(!attacker.hitbox) return;
    let h = attacker.hitbox;
    if(h.x < defender.x + 6 && h.x + h.w > defender.x - 6 && h.y < defender.y && h.y + h.h > defender.y - 30) {
       defender.takeDamage(h.dmg, attacker.dir, h.hitStop, h.launch, attacker);
       attacker.hitbox = null; 
    }
  }

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { 
    let k = e.key.toLowerCase(); keys[k] = false; 
    if(!gameActive || hitStop > 0) return;
    
    // 공격 커맨드
    if(k === 'z') p1.inputCommand('Z', keys['s']);
    if(k === 'x') p1.inputCommand('X', keys['s']);
    if(k === 'i') p2.inputCommand('Z', keys['arrowdown']);
    if(k === 'o') p2.inputCommand('X', keys['arrowdown']);

    // 태그 시스템
    if(k === 't' && p1.hpArr[1-p1.activeIdx] > 0 && p1.y === GROUND_Y && p1.state === 'idle' && p1.tagCooldown === 0) {
      p1.activeIdx = 1 - p1.activeIdx; p1.tagCooldown = 100; p1.comboCount = 0;
      createPixelParticles(p1.x, p1.y - 15, '#fff', 20);
      document.getElementById('p1-name').innerText = p1.char.name; updateHealthUI();
    }
    if(k === 'l' && p2.hpArr[1-p2.activeIdx] > 0 && p2.y === GROUND_Y && p2.state === 'idle' && p2.tagCooldown === 0) {
      p2.activeIdx = 1 - p2.activeIdx; p2.tagCooldown = 100; p2.comboCount = 0;
      createPixelParticles(p2.x, p2.y - 15, '#fff', 20);
      document.getElementById('p2-name').innerText = p2.char.name; updateHealthUI();
    }
  });

  function handleMovement() {
    const SPEED = 1.5; // 저해상도 맞춤 속도
    // P1
    if(keys['s']) p1.state = 'guard';
    else if(p1.state === 'idle' || p1.state === 'walk') {
      p1.state = 'idle';
      if(keys['a']) { p1.velX = -SPEED; p1.state = 'walk'; }
      if(keys['d']) { p1.velX = SPEED; p1.state = 'walk'; }
      if(keys['w'] && p1.y === GROUND_Y) { p1.velY = -6; p1.state = 'jump'; } // 점프
    }
    // P2
    if(keys['arrowdown']) p2.state = 'guard';
    else if(p2.state === 'idle' || p2.state === 'walk') {
      p2.state = 'idle';
      if(keys['arrowleft']) { p2.velX = -SPEED; p2.state = 'walk'; }
      if(keys['arrowright']) { p2.velX = SPEED; p2.state = 'walk'; }
      if(keys['arrowup'] && p2.y === GROUND_Y) { p2.velY = -6; p2.state = 'jump'; }
    }
  }

  function drawPixelBackground() {
    ctx.fillStyle = '#223'; ctx.fillRect(0, 0, VW, VH);
    // 도트 배경 
    ctx.fillStyle = '#112'; ctx.fillRect(0, GROUND_Y - 20, VW, 20);
    ctx.fillStyle = '#333'; ctx.fillRect(0, GROUND_Y, VW, VH - GROUND_Y);
    ctx.fillStyle = '#444'; ctx.fillRect(0, GROUND_Y, VW, 2);
  }

  function loop() {
    if(!gameActive) return;
    
    ctx.save();
    // 타격 시 화면 흔들림
    if(cameraShake > 0) {
      ctx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*4);
      cameraShake--;
    }
    
    drawPixelBackground();

    // 역경직(타격감)
    if(hitStop > 0) hitStop--;
    else if(p1.hp > 0 && p2.hp > 0 && timeLeft > 0) {
      handleMovement(); p1.update(p2); p2.update(p1); checkCollision(p1, p2); checkCollision(p2, p1);
    }
    
    renderParticles(); p1.draw(); p2.draw();
    ctx.restore();

    // 게임 오버
    if(p1.hp <= 0 || p2.hp <= 0 || timeLeft <= 0) {
       ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,VW, VH);
       ctx.fillStyle = '#ffeb3b'; ctx.font = '20px "Press Start 2P"'; ctx.textAlign = 'center';
       let msg = timeLeft <= 0 ? "TIME UP" : (p1.hp <= 0 ? "P2 WINS" : "P1 WINS");
       ctx.fillText("K.O!", VW/2, VH/2 - 10); ctx.font = '10px "Press Start 2P"'; ctx.fillText(msg, VW/2, VH/2 + 20);
    } else reqId = requestAnimationFrame(loop);
  }

  initSelect();
</script>
</body>
</html>
