<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Canvas Fighter - Arcade Edition</title>
<style>
  body {
    background-color: #000;
    color: #fff;
    font-family: 'Arial Black', Impact, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16/9;
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
    border: 4px solid #333;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 확실한 빨간색 체력바 UI */
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: none; /* 시작 시 표시됨 */
  }

  .health-container {
    position: absolute;
    top: 20px;
    width: 40%;
    height: 35px;
    background-color: #222;
    border: 3px solid #fff;
    box-shadow: 0 0 15px #000;
  }
  
  #p1-health-container { left: 30px; }
  #p2-health-container { right: 30px; }

  /* 실제 남은 체력 (빨간색) */
  .health-bar-current {
    position: absolute;
    top: 0;
    height: 100%;
    background-color: #ff0000; /* 강렬한 빨간색 */
    box-shadow: inset 0 -10px 10px rgba(0,0,0,0.5);
    transition: width 0.1s;
    z-index: 2;
  }
  #p1-health { left: 0; }
  #p2-health { right: 0; } /* P2는 오른쪽부터 깎임 */

  /* 격투 게임 특유의 깎인 체력 지연 연출 (노란색) */
  .health-bar-delay {
    position: absolute;
    top: 0;
    height: 100%;
    background-color: #ffaa00;
    transition: width 0.5s ease-out;
    z-index: 1;
  }
  #p1-health-delay { left: 0; }
  #p2-health-delay { right: 0; }

  .name-tag {
    position: absolute;
    top: 60px;
    font-size: 28px;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
  }
  #p1-name { left: 30px; color: #00ffff; }
  #p2-name { right: 30px; color: #ff00ff; }

  #timer {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 55px;
    text-shadow: 0 0 15px #fff;
  }

  /* 메뉴 화면 */
  #menu-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10;
  }
  h1 { font-size: 50px; color: #f00; text-shadow: 0 0 20px #f00; margin-bottom: 30px; }
  .start-btn {
    padding: 15px 50px; font-size: 30px; font-weight: bold; background: #f00;
    color: #fff; border: 4px solid #fff; cursor: pointer; transition: 0.2s;
  }
  .start-btn:hover { background: #fff; color: #f00; }

  /* 게임 오버 텍스트 */
  #ko-text {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 120px; color: #ffeb3b; text-shadow: 0 0 30px #f00;
    display: none; z-index: 5;
  }

  .controls { margin-top: 10px; color: #888; font-family: sans-serif; font-size: 14px; text-align: center; }
  .controls b { color: #ddd; }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="1200" height="675"></canvas>
  
  <div id="ui-layer">
    <!-- P1 체력바 -->
    <div id="p1-health-container" class="health-container">
      <div id="p1-health-delay" class="health-bar-delay" style="width: 100%;"></div>
      <div id="p1-health" class="health-bar-current" style="width: 100%;"></div>
    </div>
    <!-- P2 체력바 -->
    <div id="p2-health-container" class="health-container">
      <div id="p2-health-delay" class="health-bar-delay" style="width: 100%;"></div>
      <div id="p2-health" class="health-bar-current" style="width: 100%;"></div>
    </div>
    
    <div id="timer">99</div>
    <div id="p1-name" class="name-tag">PLAYER 1</div>
    <div id="p2-name" class="name-tag">PLAYER 2</div>
    <div id="ko-text">K.O!</div>
  </div>

  <div id="menu-layer">
    <h1>ARCADE FIGHTER</h1>
    <button class="start-btn" onclick="startGame()">INSERT COIN (START)</button>
  </div>
</div>

<div class="controls">
  <b>[P1]</b> 이동: WASD | 공격: Z(펀치), X(킥) | <b>[P2]</b> 이동: 화살표 | 공격: I(펀치), O(킥)
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // 시스템 변수
  let requestID;
  let gameActive = false;
  let timer = 99;
  let hitStopFrames = 0; // 타격 시 화면 정지(역경직)
  let cameraShake = 0;

  const GROUND_Y = 550;
  const GRAVITY = 1.2;

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // 화면 UI 업데이트 함수
  function updateHealthUI() {
    // P1
    document.getElementById('p1-health').style.width = p1.hp + '%';
    setTimeout(() => { document.getElementById('p1-health-delay').style.width = p1.hp + '%'; }, 300);
    // P2
    document.getElementById('p2-health').style.width = p2.hp + '%';
    setTimeout(() => { document.getElementById('p2-health-delay').style.width = p2.hp + '%'; }, 300);
  }

  // 플레이어 클래스
  class Fighter {
    constructor(x, side, color) {
      this.x = x;
      this.y = GROUND_Y;
      this.width = 70;
      this.height = 160;
      this.side = side;
      this.dir = side === 1 ? 1 : -1;
      this.color = color;
      
      this.hp = 100;
      this.velX = 0;
      this.velY = 0;
      
      this.state = 'idle'; // idle, walk, jump, guard, attack, hit
      this.frame = 0; // 애니메이션/판정용 프레임 타이머
      
      this.hitbox = null; // 공격 판정 박스
    }

    update(enemy) {
      // 방향 전환 (공격 중이 아닐 때만 적을 바라봄)
      if(this.state === 'idle' || this.state === 'walk') {
        this.dir = enemy.x > this.x ? 1 : -1;
      }

      // 물리 엔진 (점프 및 중력)
      if(this.y < GROUND_Y) {
        this.velY += GRAVITY;
        this.y += this.velY;
      } else {
        this.y = GROUND_Y;
        this.velY = 0;
        if(this.state === 'jump') this.state = 'idle';
      }

      this.x += this.velX;
      // 화면 밖 이탈 방지
      this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));

      // 마찰력 감속 (땅에 있을 때)
      if(this.y === GROUND_Y && this.state !== 'walk' && this.state !== 'hit') {
        this.velX *= 0.8;
      }

      // 상태별 프레임 관리
      if(this.state === 'attack') {
        this.frame++;
        // 프레임 5~10 구간에만 공격 판정(Hitbox) 생성
        if(this.frame > 5 && this.frame < 12) {
          this.hitbox = {
            x: this.x + (this.dir === 1 ? this.width : -60),
            y: this.y - 120,
            w: 60, h: 40, dmg: 10
          };
        } else {
          this.hitbox = null; // 판정 종료
        }
        // 공격 모션 종료
        if(this.frame > 25) this.state = 'idle';
      } 
      else if(this.state === 'hit') {
        this.frame++;
        if(this.frame > 20) this.state = 'idle'; // 경직 끝
      }
      else {
        this.frame = 0;
        this.hitbox = null;
      }
    }

    attack() {
      if(this.state === 'idle' || this.state === 'walk') {
        this.state = 'attack';
        this.frame = 0;
        this.velX = 0; // 공격 시 멈춤
      }
    }

    takeDamage(dmg, knockbackDir) {
      if(this.state === 'guard') {
        // 가드 데미지(칩 데미지)
        this.hp -= dmg * 0.2;
        this.velX = knockbackDir * 3;
      } else {
        this.hp -= dmg;
        this.state = 'hit';
        this.frame = 0;
        this.velX = knockbackDir * 12; // 넉백
        this.velY = -5; // 살짝 뜸
      }
      this.hp = Math.max(0, this.hp);
      updateHealthUI();
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);

      // 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(this.width/2, 0, 40, 10, 0, 0, Math.PI*2);
      ctx.fill();

      // 캐릭터 몸통 렌더링
      ctx.fillStyle = this.state === 'hit' ? '#fff' : this.color;
      
      // 상태에 따른 외형 변화 (아주 단순화된 애니메이션)
      let tilt = 0;
      if(this.state === 'walk') tilt = 10 * this.dir;
      if(this.state === 'attack') tilt = 20 * this.dir;
      if(this.state === 'guard') tilt = -10 * this.dir;
      if(this.state === 'hit') tilt = -30 * this.dir;

      // 몸통
      ctx.fillRect(tilt, -this.height, this.width, this.height);
      
      // 가드 이펙트
      if(this.state === 'guard') {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 5;
        ctx.strokeRect(tilt - 10, -this.height - 10, this.width + 20, this.height + 20);
      }

      // 눈(방향 표시)
      ctx.fillStyle = '#fff';
      ctx.fillRect(tilt + (this.dir === 1 ? this.width - 20 : 5), -this.height + 20, 15, 15);

      ctx.restore();

      // 디버그용 힛박스 (타격감을 위해 번쩍이는 효과로 재활용)
      if(this.hitbox) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(this.hitbox.x, this.hitbox.y, this.hitbox.w, this.hitbox.h);
      }
    }
  }

  let p1, p2;
  let particles = [];

  function startGame() {
    document.getElementById('menu-layer').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    document.getElementById('ko-text').style.display = 'none';
    
    // 캐릭터 생성 (빨강 vs 파랑)
    p1 = new Fighter(200, 1, '#ff3333');
    p2 = new Fighter(900, 2, '#3333ff');
    
    timer = 99;
    gameActive = true;
    updateHealthUI();
    
    // 1초마다 타이머 감소
    const timerInterval = setInterval(() => {
      if(!gameActive) clearInterval(timerInterval);
      else if(timer > 0) {
        timer--;
        document.getElementById('timer').innerText = timer;
      }
    }, 1000);

    requestID = requestAnimationFrame(gameLoop);
  }

  // 조작 처리
  function handleInput() {
    const SPEED = 8;
    
    // P1 (WASD, Z, X)
    p1.state = (p1.state === 'idle' || p1.state === 'walk' || p1.state === 'guard') ? 'idle' : p1.state;
    if(p1.state === 'idle') {
      if(keys['s']) p1.state = 'guard';
      else {
        if(keys['a']) { p1.velX = -SPEED; p1.state = 'walk'; }
        if(keys['d']) { p1.velX = SPEED; p1.state = 'walk'; }
        if(keys['w'] && p1.y === GROUND_Y) { p1.velY = -22; p1.state = 'jump'; }
        if(keys['z'] || keys['x']) p1.attack();
      }
    }

    // P2 (방향키, I, O)
    p2.state = (p2.state === 'idle' || p2.state === 'walk' || p2.state === 'guard') ? 'idle' : p2.state;
    if(p2.state === 'idle') {
      if(keys['arrowdown']) p2.state = 'guard';
      else {
        if(keys['arrowleft']) { p2.velX = -SPEED; p2.state = 'walk'; }
        if(keys['arrowright']) { p2.velX = SPEED; p2.state = 'walk'; }
        if(keys['arrowup'] && p2.y === GROUND_Y) { p2.velY = -22; p2.state = 'jump'; }
        if(keys['i'] || keys['o']) p2.attack();
      }
    }
  }

  // 충돌 판정 (Hitbox vs Hurtbox)
  function checkHit(attacker, defender) {
    if(!attacker.hitbox) return;
    
    let box = attacker.hitbox;
    // 방어자의 영역(Hurtbox)은 현재 x, y를 기준으로 계산
    if(box.x < defender.x + defender.width &&
       box.x + box.w > defender.x &&
       box.y < defender.y &&
       box.y + box.h > defender.y - defender.height) 
    {
       defender.takeDamage(box.dmg, attacker.dir);
       attacker.hitbox = null; // 다단히트 방지
       
       // 타격감 연출 (역경직과 카메라 흔들림)
       hitStopFrames = 5;
       cameraShake = 10;
       createParticles(box.x + box.w/2, box.y + box.h/2);
    }
  }

  // 타격 이펙트(파티클) 생성
  function createParticles(x, y) {
    for(let i=0; i<15; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 15,
        vy: (Math.random() - 0.5) * 15,
        life: 1.0
      });
    }
  }

  function drawParticles() {
    for(let i=particles.length-1; i>=0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.05;
      if(p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(p.x, p.y, 8, 8);
    }
    ctx.globalAlpha = 1.0;
  }

  // 메인 게임 루프
  function gameLoop() {
    if(!gameActive) return;

    // 화면 지우기 (배경 그리기)
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 바닥 선 그리기
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    ctx.save();
    
    // 1. 역경직 (Hit Stop) 처리
    if(hitStopFrames > 0) {
      hitStopFrames--;
    } else {
      // 역경직이 아닐 때만 로직 업데이트
      handleInput();
      p1.update(p2);
      p2.update(p1);
      
      checkHit(p1, p2);
      checkHit(p2, p1);
    }

    // 2. 카메라 흔들림 (Screen Shake)
    if(cameraShake > 0) {
      ctx.translate((Math.random()-0.5)*cameraShake, (Math.random()-0.5)*cameraShake);
      cameraShake--;
    }

    // 3. 렌더링
    p1.draw();
    p2.draw();
    drawParticles();
    
    ctx.restore();

    // 4. 게임 오버 판정
    if(p1.hp <= 0 || p2.hp <= 0 || timer <= 0) {
      document.getElementById('ko-text').style.display = 'block';
      gameActive = false;
      
      // 3초 후 메뉴로 복귀
      setTimeout(() => {
        document.getElementById('menu-layer').style.display = 'flex';
        document.getElementById('ui-layer').style.display = 'none';
      }, 3000);
    } else {
      requestID = requestAnimationFrame(gameLoop);
    }
  }
</script>
</body>
</html>
